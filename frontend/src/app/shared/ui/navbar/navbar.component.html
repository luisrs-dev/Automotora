<!-- ══ ANNOUNCEMENT BAR ══ -->
@if(true){
  <div class="announce-bar" role="banner" aria-label="Información de la automotora">
    <div class="announce-bar__inner">

      <div class="announce-bar__location-wrapper">
        <svg class="announce-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="announce-bar__location">Talca, Región del Maule</span>
      </div>

      <div class="announce-bar__right">
        <!-- Phone CTA -->
        <a href="tel:+56912345678" class="announce-call">
          <!-- Animated phone icon -->
          <svg class="announce-call__icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          <span class="announce-call__label">¡Llámanos HOY!</span>
          <span class="announce-call__number">+56 9 1234 5678</span>
        </a>
  
        <!-- Separator -->
        <span class="announce-sep" aria-hidden="true">|</span>
  
        <!-- Social icons -->
        <div class="announce-social" aria-label="Redes sociales">
          <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="announce-social__link" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>
          </a>
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="announce-social__link" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          </a>
        </div>
      </div>

    </div>
  </div>
}

<!-- ══ NAVBAR ══ -->
<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <div class="navbar__inner max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Logo + Tagline -->
    <a class="navbar__logo" routerLink="/joseluisjara" aria-label="Inicio">
      <img
        src="logo-transparente.png"
        alt="Automotora José Luis Jara"
        class="navbar__logo-img"
        loading="eager"
      />
      <span class="navbar__logo-divider" aria-hidden="true"></span>
      <span class="navbar__logo-tagline">SEMINUEVOS<br>& USADOS</span>
    </a>

    <!-- Nav links (desktop) -->
    <nav class="navbar__links" aria-label="Navegación principal">
      <a routerLink="/joseluisjara" routerLinkActive="navbar__link--active" [routerLinkActiveOptions]="{exact:true}" class="navbar__link">
        Catálogo
      </a>
      <a routerLink="/joseluisjara/compramos-tu-auto" routerLinkActive="navbar__link--active" class="navbar__link">
        Compramos tu auto
      </a>
      <a routerLink="/joseluisjara/financiamiento" routerLinkActive="navbar__link--active" class="navbar__link">Financiamiento</a>
      <a routerLink="/joseluisjara/empresa" routerLinkActive="navbar__link--active" class="navbar__link">Empresa</a>
      <a routerLink="/joseluisjara/contacto" routerLinkActive="navbar__link--active" class="navbar__link">Contacto</a>
    </nav>

    <!-- Right side -->
    <div class="navbar__actions">
      <!-- WhatsApp CTA -->
      <a
        href="https://wa.me/56912345678?text=Hola,%20me%20interesa%20un%20auto%20de%20su%20catálogo"
        target="_blank"
        rel="noopener noreferrer"
        class="navbar__whatsapp"
        aria-label="Contactar por WhatsApp"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        <span class="navbar__whatsapp-text">WhatsApp</span>
      </a>

      <!-- Separator -->
      <div class="navbar__sep"></div>

      <!-- Dark mode toggle -->
      <button
        (click)="toggleTheme()"
        class="navbar__theme-btn"
        aria-label="Cambiar tema"
        type="button"
      >
        @if (isDarkTheme()) {
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 1.336a1 1 0 011.415 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-1.336 4.22a1 1 0 010 1.415l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.415 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-1.336a1 1 0 01-1.415 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.415zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm1.336-4.22a1 1 0 010-1.415l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.415 0zM10 5a5 5 0 100 10 5 5 0 000-10z"/>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
          </svg>
        }
      </button>

      <!-- Hamburger (mobile) -->
      <button
        class="navbar__hamburger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Menú"
        type="button"
      >
        <span class="navbar__hamburger-bar" [class.navbar__hamburger-bar--open]="menuOpen()"></span>
        <span class="navbar__hamburger-bar" [class.navbar__hamburger-bar--open]="menuOpen()"></span>
        <span class="navbar__hamburger-bar" [class.navbar__hamburger-bar--open]="menuOpen()"></span>
      </button>
    </div>
  </div>

  <!-- Mobile drawer -->
  @if (menuOpen()) {
    <nav class="navbar__mobile-menu" aria-label="Menú móvil">
      <a routerLink="/joseluisjara" (click)="toggleMenu()" class="navbar__mobile-link">Catálogo</a>
      <a routerLink="/joseluisjara/compramos-tu-auto" (click)="toggleMenu()" class="navbar__mobile-link">Compramos tu auto</a>
      <a routerLink="/joseluisjara/financiamiento" (click)="toggleMenu()" class="navbar__mobile-link">Financiamiento</a>
      <a routerLink="/joseluisjara/empresa" (click)="toggleMenu()" class="navbar__mobile-link">Empresa</a>
      <a routerLink="/joseluisjara/contacto" (click)="toggleMenu()" class="navbar__mobile-link">Contacto</a>
      <a
        href="https://wa.me/56912345678"
        target="_blank"
        rel="noopener noreferrer"
        class="navbar__mobile-whatsapp"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Contactar por WhatsApp
      </a>
    </nav>
  }
</header>
